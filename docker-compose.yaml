# Django app + PostgreSQL with Docker Compose.
#
# First copy .env.example to .env and set POSTGRES_PASSWORD (.env is not committed).
#
# Local:  docker compose up -d --build            -> builds the image from this repo
# EC2:    deploy.sh / server-cmds.sh write IMAGE_NAME to .env, e.g.
#         IMAGE_NAME=177203142220.dkr.ecr.eu-north-1.amazonaws.com/my-app:django-v1.<N>
#                                                  -> pulls the image Jenkins pushed to ECR
# Stop:   docker compose down        (add -v to also delete the database volume)
services:
  django-app:
    image: ${IMAGE_NAME:-django-app:local}
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: "*"
      # "db" is the service name below; Compose's network resolves it to that container
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        # Wait until the healthcheck passes, not just until the container starts
        condition: service_healthy
    restart: unless-stopped

  db:
    # postgres:17 keeps its data in /var/lib/postgresql/data (18 moved it)
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Named volume: the data survives `docker compose down` and container re-creation
      - db-data:/var/lib/postgresql/data
    # No "ports:" on purpose: only the app can reach the database, not the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
