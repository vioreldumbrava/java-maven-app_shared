services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      # Non-secret values referenced in casc/jenkins.yaml. Put them in jenkins/.env (see .env.example).
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      DOCKER_HUB_USER: ${DOCKER_HUB_USER:-}
      GITLAB_USER: ${GITLAB_USER:-}
      REPO_URL: ${REPO_URL:?Set REPO_URL in jenkins/.env (git URL of this project)}
      REPO_BRANCH: ${REPO_BRANCH:-master}
      DJANGO_REPO_URL: ${DJANGO_REPO_URL:-https://github.com/vioreldumbrava/java-maven-app_shared.git}
      DJANGO_BRANCH: ${DJANGO_BRANCH:-django-app}
    volumes:
      - jenkins_home:/var/jenkins_home
      # JCasC YAML is mounted, not baked in: edit it, then Manage Jenkins > Configuration as Code > Reload
      - ./casc:/var/jenkins_casc:ro
      # Only needed for Jenkinsfile-SharedLibrary (docker build/push). Gives Jenkins root-equivalent
      # control of the host's Docker, and on Linux the jenkins user also needs access to the socket.
      # - /var/run/docker.sock:/var/run/docker.sock
    # Each secret is mounted as /run/secrets/<name> and read by JCasC as ${<name>}
    secrets:
      - jenkins_admin_password
      - docker_hub_password
      - gitlab_password
      - ec2_server_key
      - postgres_password

secrets:
  jenkins_admin_password:
    file: ./secrets/jenkins_admin_password
  docker_hub_password:
    file: ./secrets/docker_hub_password
  gitlab_password:
    file: ./secrets/gitlab_password
  ec2_server_key:
    file: ./secrets/ec2_server_key
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  jenkins_home:
